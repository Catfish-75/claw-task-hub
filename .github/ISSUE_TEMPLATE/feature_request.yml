name: Feature request
description: Suggest an improvement for agentic task workflows.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Claw Task Hub is local-first and agent-first. Please describe how this helps agents, harnesses, or local operators.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Claw Task Hub do instead?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - CLI
        - MCP
        - UI
        - API
        - Database
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: agent_contract
    attributes:
      label: Agent or harness contract impact
      description: Include tool names, payload shape, status semantics, or lifecycle changes if relevant.
